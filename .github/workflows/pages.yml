name: Build and publish web edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v7.0.1
      - name: Install Node.js
        uses: actions/setup-node@v7.1.0
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test portable gameplay and gate physics
        run: npm run test:ci
      - name: Build public web edition
        run: npm run build
      - name: Audit public build for table assets
        run: node scripts/verify-public-build.mjs dist
      - name: Verify required WASM artifact
        run: test -f dist/node_modules/@francisdb/vpin-wasm/vpin_bg.wasm
      - name: Configure Pages
        uses: actions/configure-pages@v6.0.0
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v5.0.0
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-24.04
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5.0.1
