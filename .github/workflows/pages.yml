name: Build and publish web edition

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci --ignore-scripts
      - name: Test portable gameplay and gate physics
        run: npm run test:ci
      - name: Build public web edition
        run: npm run build
      - name: Verify copyrighted local VPX assets are absent
        shell: bash
        run: |
          test -f dist/index.html
          test -f dist/node_modules/@francisdb/vpin-wasm/vpin_bg.wasm
          test ! -f dist/assets/vpx-local/space-cadet.glb
          test ! -f dist/assets/vpx-local/space-cadet.physics.json
          test ! -f dist/assets/vpx-local/source-script.vbs
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload web artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  deploy:
    environment:
      name: github-pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
